<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>DESTIN — Football Career</title>
<style>
:root{--bg:#08090b;--card:#111318;--line:#272a31;--text:#f5f5f2;--muted:#9b9ea7;--accent:#d7ff45;--accent2:#8fb31d;--danger:#ff6875}
*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 50% -10%,#1b2027 0,#090a0c 46%,#050506 100%);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;min-height:100vh}
button,input,select{font:inherit}button{border:0}
.app{width:100%;max-width:760px;margin:auto;min-height:100vh;padding:18px 16px 34px}
.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:22px}.brand{font-weight:800;letter-spacing:.18em;font-size:13px}.year{color:var(--muted);font-size:12px}
.screen{display:none}.screen.active{display:block}.eyebrow{font-size:11px;letter-spacing:.22em;color:var(--muted);text-transform:uppercase}.title{font-size:clamp(34px,9vw,62px);line-height:.92;letter-spacing:-.05em;margin:10px 0 16px;font-weight:850}.lead{font-size:17px;line-height:1.5;color:#c3c5ca;max-width:620px}
.card{background:linear-gradient(145deg,rgba(25,27,32,.96),rgba(12,13,16,.96));border:1px solid var(--line);border-radius:24px;padding:20px;box-shadow:0 18px 60px rgba(0,0,0,.28);margin-top:16px}.grid{display:grid;gap:12px}.grid2{grid-template-columns:1fr 1fr}.label{font-size:11px;text-transform:uppercase;letter-spacing:.16em;color:var(--muted);margin-bottom:7px}.field{width:100%;background:#0b0c0f;color:var(--text);border:1px solid #2b2e35;border-radius:14px;padding:14px;outline:none}.field:focus{border-color:var(--accent)}.choices{display:grid;gap:10px}.choice{padding:15px 16px;border:1px solid #2b2e35;border-radius:16px;background:#0d0f12;color:var(--text);text-align:left;cursor:pointer;transition:.18s}.choice:hover{border-color:#555b65;transform:translateY(-1px)}.choice.selected{border-color:var(--accent);background:rgba(215,255,69,.07);box-shadow:inset 0 0 0 1px rgba(215,255,69,.18)}.choice b{display:block;font-size:15px}.choice span{display:block;color:var(--muted);font-size:12px;margin-top:4px;line-height:1.4}
.cta{width:100%;padding:16px 18px;border-radius:16px;background:var(--accent);color:#090a08;font-weight:850;cursor:pointer;margin-top:14px}.cta:disabled{opacity:.35;cursor:not-allowed}.ghost{background:#15171b;color:#ddd;border:1px solid #2b2e35}
.progress{height:4px;background:#1b1d21;border-radius:9px;overflow:hidden;margin:10px 0 24px}.progress i{display:block;height:100%;width:25%;background:var(--accent);transition:.3s}
.profile{display:grid;grid-template-columns:auto 1fr auto;gap:14px;align-items:center}.avatar{width:58px;height:58px;border-radius:18px;background:linear-gradient(135deg,#3b424c,#14161a);display:grid;place-items:center;font-size:23px;font-weight:800}.name{font-size:20px;font-weight:800}.sub{font-size:12px;color:var(--muted);margin-top:3px}.age{font-size:28px;font-weight:850}.statrow{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:16px}.stat{background:#0c0e11;border:1px solid #23262c;border-radius:14px;padding:11px}.stat small{display:block;color:var(--muted);font-size:9px;letter-spacing:.12em;text-transform:uppercase}.stat strong{display:block;font-size:18px;margin-top:5px}.story{font-size:19px;line-height:1.55;letter-spacing:-.01em}.story em{color:#d4d6db}.meta{display:flex;gap:8px;flex-wrap:wrap;margin:14px 0}.pill{padding:7px 10px;border:1px solid #2c2f36;border-radius:99px;color:#bbbfc7;font-size:11px}.choice-list{display:grid;gap:10px;margin-top:18px}.choice-list button{background:#f3f3ef;color:#0a0b0c;border-radius:16px;padding:15px;text-align:left;font-weight:750;cursor:pointer}.choice-list button span{display:block;color:#64676e;font-weight:500;font-size:11px;margin-top:4px}.feedback{border-left:2px solid var(--accent);padding-left:13px;color:#c9ccd2;line-height:1.5;margin-top:16px}.timeline{display:flex;justify-content:space-between;gap:6px;margin:20px 0 5px}.dot{height:7px;border-radius:8px;background:#292c32;flex:1}.dot.done{background:var(--accent)}.bar{height:7px;background:#1c1e23;border-radius:99px;overflow:hidden}.bar i{display:block;height:100%;background:var(--accent);width:40%}.save{color:#747880;font-size:11px;text-align:center;margin-top:14px}.danger{color:var(--danger)}
@media(max-width:520px){.app{padding:15px 13px 28px}.card{padding:16px;border-radius:20px}.grid2{grid-template-columns:1fr}.statrow{grid-template-columns:repeat(2,1fr)}.story{font-size:18px}}
</style>
</head>
<body>
<div class="app">
  <div class="top"><div class="brand">DESTIN / FOOTBALL</div><div class="year" id="topYear"></div></div>

  <section id="home" class="screen active">
    <div class="eyebrow">Une carrière. Des milliers de destins.</div>
    <div class="title">Ta vie.<br>Ton football.</div>
    <p class="lead">Crée un joueur. Fais ses choix. Subis les conséquences. Ici, personne ne connaît la fin de son histoire.</p>
    <div class="card">
      <div class="eyebrow">Nouvelle carrière</div>
      <button class="cta" onclick="startCreate()">Créer mon joueur</button>
      <button class="cta ghost" id="continueBtn" onclick="continueCareer()" style="display:none">Continuer ma carrière</button>
    </div>
    <div class="save" id="saveState"></div>
  </section>

  <section id="create" class="screen">
    <div class="eyebrow">Création / identité</div>
    <div class="progress"><i id="createProgress"></i></div>
    <div id="createStep"></div>
  </section>

  <section id="career" class="screen">
    <div class="profile card">
      <div class="avatar" id="avatar">?</div><div><div class="name" id="pName"></div><div class="sub" id="pSub"></div></div><div class="age" id="pAge"></div>
    </div>
    <div class="statrow">
      <div class="stat"><small>Talent</small><strong id="sTalent">50</strong></div>
      <div class="stat"><small>Mental</small><strong id="sMental">50</strong></div>
      <div class="stat"><small>Forme</small><strong id="sForm">80</strong></div>
      <div class="stat"><small>Réputation</small><strong id="sRep">0</strong></div>
    </div>
    <div class="timeline" id="timeline"></div>
    <div class="card">
      <div class="eyebrow" id="eventMeta"></div>
      <div class="story" id="story"></div>
      <div class="choice-list" id="choices"></div>
      <div class="feedback" id="feedback" style="display:none"></div>
    </div>
    <div class="save" id="careerSave"></div>
  </section>

  <section id="retired" class="screen">
    <div class="eyebrow">Fin de carrière</div>
    <div class="title" id="retireTitle"></div>
    <div class="card" id="retireCard"></div>
    <button class="cta" onclick="newCareer()">Créer une nouvelle carrière</button>
  </section>
</div>

<script>
const KEY="destin_football_v1";
let game=JSON.parse(localStorage.getItem(KEY)||"null");
let create={step:0,name:"",nationality:"France",style:"Créateur",environment:"Famille stable",position:"Milieu offensif",trait:"Ambitieux"};
const steps=[
 {title:"Qui es-tu ?",html:`<div class="grid"><div><div class="label">Prénom</div><input class="field" id="name" maxlength="18" placeholder="Ex. Yanis"></div><div><div class="label">Nationalité</div><select class="field" id="nat"><option>France</option><option>Espagne</option><option>Brésil</option><option>Maroc</option><option>Portugal</option><option>Angleterre</option><option>Sénégal</option><option>Argentine</option></select></div></div><button class="cta" onclick="nextCreate()">Continuer</button>`},
 {title:"Quel footballeur ?",html:`<div class="label">Poste</div><div class="choices" id="pos">${opts(["Attaquant","Ailier","Milieu offensif","Milieu","Défenseur","Gardien"],"position")}</div><div class="label" style="margin-top:18px">Style</div><div class="choices" id="sty">${opts(["Finisseur","Dribbleur","Créateur","Box-to-box","Défenseur agressif","Gardien moderne"],"style")}</div><button class="cta" onclick="nextCreate()">Continuer</button>`},
 {title:"D'où viens-tu ?",html:`<div class="label">Ton environnement</div><div class="choices" id="env">${opts(["Famille stable","Famille modeste","Quartier difficile","Parents absents","Famille de footballeurs"],"environment")}</div><div class="label" style="margin-top:18px">Ton caractère</div><div class="choices" id="tr">${opts(["Ambitieux","Discret","Fêtard","Travailleur","Impulsif","Leader"],"trait")}</div><button class="cta" onclick="nextCreate()">Continuer</button>`},
 {title:"Tout commence ici.",html:`<p class="lead">Tu as 15 ans. Tu n'es encore personne dans le monde professionnel. Ce que tu vas devenir dépendra de ce que tu feras à partir de maintenant.</p><div class="card" style="margin:16px 0;background:#0a0c0f"><div class="profile"><div class="avatar">${initial()}</div><div><div class="name" id="previewName"></div><div class="sub" id="previewSub"></div></div><div>15</div></div></div><button class="cta" onclick="beginCareer()">Commencer ma carrière</button>`}
];
function opts(arr,key){return arr.map(x=>`<button class="choice ${create[key]===x?"selected":""}" onclick="pick('${key}',this)" data-v="${x}"><b>${x}</b><span>${desc(x)}</span></button>`).join("")}
function desc(x){const d={Attaquant:"Cherche le but, vit dans la surface.",Ailier:"Vitesse, un contre un, liberté.", "Milieu offensif":"Vision, créativité, dernière passe.",Milieu:"Volume, intelligence, équilibre.",Défenseur:"Duels, placement, caractère.",Gardien:"Réflexes, anticipation, sang-froid.",Finisseur:"Tu préfères une occasion à dix touches de balle.",Dribbleur:"Tu prends des risques pour éliminer.",Créateur:"Tu veux décider du rythme.", "Box-to-box":"Tu veux être partout.", "Défenseur agressif":"Tu ne recules devant personne.","Gardien moderne":"Tu participes au jeu.", "Famille stable":"Un cadre rassurant, mais des attentes.", "Famille modeste":"Chaque dépense compte.", "Quartier difficile":"Tu as appris tôt à te débrouiller.", "Parents absents":"Tu as grandi en autonomie.", "Famille de footballeurs":"Le football est dans la famille.",Ambitieux:"Tu veux aller tout en haut.",Discret:"Tu préfères prouver sur le terrain.",Fêtard:"Tu veux profiter de ta jeunesse.",Travailleur:"Tu acceptes de faire les sacrifices.",Impulsif:"Tu agis avant de réfléchir.",Leader:"Les autres se tournent naturellement vers toi."};return d[x]||""}
function initial(){return (create.name||"?").trim().charAt(0).toUpperCase()||"?"}
function show(id){document.querySelectorAll(".screen").forEach(x=>x.classList.remove("active"));document.getElementById(id).classList.add("active");scrollTo(0,0)}
function startCreate(){create={step:0,name:"",nationality:"France",style:"Créateur",environment:"Famille stable",position:"Milieu offensif",trait:"Ambitieux"};show("create");renderCreate()}
function renderCreate(){document.getElementById("createProgress").style.width=((create.step+1)/steps.length*100)+"%";document.getElementById("createStep").innerHTML=`<div class="eyebrow">Étape ${create.step+1} / ${steps.length}</div><div class="title" style="font-size:42px">${steps[create.step].title}</div>${steps[create.step].html}`;if(create.step===0){document.getElementById("name").value=create.name;document.getElementById("nat").value=create.nationality}if(create.step===3){document.getElementById("previewName").textContent=create.name||"Joueur sans nom";document.getElementById("previewSub").textContent=`${create.nationality} · ${create.position} · ${create.style}`}}
function pick(key,b){create[key]=b.dataset.v;b.parentElement.querySelectorAll(".choice").forEach(x=>x.classList.remove("selected"));b.classList.add("selected")}
function nextCreate(){if(create.step===0){create.name=document.getElementById("name").value.trim()||"Noah";create.nationality=document.getElementById("nat").value}create.step++;renderCreate()}
function beginCareer(){const base={name:create.name||"Noah",nationality:create.nationality,position:create.position,style:create.style,environment:create.environment,trait:create.trait,age:15,year:2026,talent:initialTalent(),mental:50,form:82,rep:0,money:0,club:"Académie locale",event:0,history:[],created:Date.now()};game=base;save();show("career");renderCareer()}
function initialTalent(){let t=52;if(create.style==="Dribbleur"||create.style==="Créateur")t+=5;if(create.environment==="Famille de footballeurs")t+=4;if(create.trait==="Travailleur")t+=4;if(create.trait==="Ambitieux")t+=2;return t}
const events=[
 {min:15,max:15,title:"Le premier vrai test",text:"Après l'entraînement, ton éducateur te retient. Un recruteur d'un club professionnel sera présent samedi. Il te regarde droit dans les yeux : « Tu as quelque chose. Mais est-ce que tu es prêt à travailler pour l'avoir ? »",choices:[
  ["Rester une heure de plus","Tu travailles seul jusqu'à la fermeture.",{talent:4,form:-5,mental:2,rep:1}],
  ["Demander des conseils","Tu demandes exactement ce que tu dois améliorer.",{talent:2,mental:4}],
  ["Rentrer te reposer","Tu gardes ton énergie pour samedi.",{form:5,mental:1}],
  ["Sortir avec tes amis","Pour toi, le football ne doit pas prendre toute la place.",{form:-2,mental:3,talent:-1}]
 ]},
 {min:16,max:17,title:"La première décision",text:"Un club plus grand s'intéresse à toi. Le niveau est supérieur, mais tu risques de passer beaucoup de temps sur le banc. Ton club actuel te promet du temps de jeu.",choices:[
  ["Partir pour le grand club","Tu acceptes le risque.",{talent:5,rep:3,mental:-2}],
  ["Rester pour jouer","Tu veux d'abord devenir titulaire.",{talent:2,rep:1,mental:3}],
  ["Demander un essai","Tu veux voir avant de choisir.",{talent:3,mental:2}]
 ]},
 {min:18,max:20,title:"Ton premier contrat",text:"Tu as enfin une proposition professionnelle. Le salaire est faible, mais c'est ton premier contrat. Ton agent te demande ce que tu veux vraiment.",choices:[
  ["Signer immédiatement","Tu sécurises ta place.",{money:2,rep:2,mental:2}],
  ["Négocier le projet sportif","Tu veux comprendre où le club te voit.",{talent:3,mental:3}],
  ["Attendre une meilleure offre","Tu prends le risque de tout perdre.",{rep:-2,mental:-3,talent:2}]
 ]},
 {min:20,max:23,title:"Le moment où tout bascule",text:"Tu enchaînes les bonnes performances. Des clubs commencent à parler de toi. Mais tu sens la fatigue s'accumuler.",choices:[
  ["Jouer malgré tout","Tu refuses de sortir du onze.",{rep:5,talent:2,form:-15,mental:1}],
  ["Lever le pied","Tu protèges ton corps.",{form:10,mental:3}],
  ["Travailler autrement","Musculation, récupération, analyse vidéo.",{talent:4,form:4,mental:4}]
 ]},
 {min:21,max:28,title:"L'appel",text:"Ton téléphone sonne. Le sélectionneur de ta catégorie veut te convoquer. Rien n'est garanti : tu dois choisir comment gérer la pression.",choices:[
  ["Ne penser qu'au terrain","Tu bloques tout le reste.",{rep:6,mental:-2}],
  ["Profiter de l'instant","Tu arrives libéré.",{mental:5,rep:3}],
  ["Appeler ta famille","Tu partages le moment avec les tiens.",{mental:6,rep:2}]
 ]},
 {min:24,max:30,title:"L'offre qui change une vie",text:"Une proposition arrive de l'étranger. Plus d'argent, une ville inconnue, une langue nouvelle. Sportivement, c'est un énorme pari.",choices:[
  ["Partir à l'étranger","Tu quittes tout pour tenter ta chance.",{money:10,rep:8,talent:5,mental:-3}],
  ["Rester ici","Tu privilégies la stabilité.",{mental:5,rep:3,talent:2}],
  ["Demander à ton entourage","Tu prends le temps d'écouter ceux qui te connaissent.",{mental:4}]
 ]},
 {min:27,max:34,title:"Le corps dit stop",text:"À l'entraînement, une douleur inhabituelle apparaît. Le staff te conseille de faire des examens. Tu peux écouter ton corps ou prendre le risque de continuer.",choices:[
  ["Faire les examens","Tu acceptes de manquer quelques matches.",{form:8,mental:4,rep:-1}],
  ["Continuer","Tu ne veux pas perdre ta place.",{form:-20,rep:4,talent:2}],
  ["Changer ton hygiène de vie","Tu prends ça comme un avertissement.",{form:12,mental:5,talent:2}]
 ]},
 {min:30,max:38,title:"Le sommet",text:"Tu viens de réaliser la meilleure saison de ta carrière. Tout le monde parle de toi. Une question apparaît pourtant : qu'est-ce que tu veux laisser derrière toi ?",choices:[
  ["Chercher la gloire","Tu veux devenir une star.",{rep:12,talent:5,mental:-2,money:8}],
  ["Gagner des titres","Tu privilégies le collectif.",{rep:9,talent:4,mental:4}],
  ["Construire quelque chose","Tu penses déjà à l'après-foot.",{money:5,mental:8,rep:4}]
 ]},
 {min:35,max:40,title:"Dernière saison",text:"Ton corps récupère moins vite. Tu le sais. Tu pourrais continuer encore une saison dans un championnat plus modeste, ou annoncer toi-même la fin.",choices:[
  ["Une dernière danse","Tu veux finir sur le terrain.",{rep:6,mental:6,form:-8}],
  ["Arrêter maintenant","Tu veux partir avant que le jeu décide pour toi.",{mental:10}],
  ["Devenir mentor","Tu commences déjà à transmettre.",{mental:12,rep:5}]
 ]}
];
function getEvent(){let possible=events.filter(e=>game.age>=e.min&&game.age<=e.max);if(!possible.length)return events[events.length-1];return possible[game.event%possible.length]}
function renderCareer(){document.getElementById("topYear").textContent=game.year;document.getElementById("avatar").textContent=game.name.charAt(0).toUpperCase();document.getElementById("pName").textContent=game.name;document.getElementById("pSub").textContent=`${game.nationality} · ${game.position} · ${game.club}`;document.getElementById("pAge").textContent=game.age;["Talent","Mental","Form","Rep"].forEach((x,i)=>{document.getElementById("s"+x).textContent=[game.talent,game.mental,game.form,game.rep][i]});document.getElementById("timeline").innerHTML=[15,18,21,25,30,35,40].map(a=>`<div class="dot ${game.age>=a?"done":""}"></div>`).join("");let e=getEvent();document.getElementById("eventMeta").textContent=`${game.year} · ${game.age} ANS · ${game.club}`;document.getElementById("story").innerHTML=e.text;document.getElementById("choices").innerHTML=e.choices.map((c,i)=>`<button onclick="choose(${i})">${c[0]}<span>${hint(c[2])}</span></button>`).join("");document.getElementById("feedback").style.display="none";document.getElementById("careerSave").textContent="Sauvegarde automatique · ta carrière est conservée sur cet appareil"}
function hint(ch){let a=[];if(ch.talent)a.push((ch.talent>0?"+":"")+ch.talent+" talent");if(ch.mental)a.push((ch.mental>0?"+":"")+ch.mental+" mental");if(ch.form)a.push((ch.form>0?"+":"")+ch.form+" forme");if(ch.rep)a.push((ch.rep>0?"+":"")+ch.rep+" réputation");return a.join(" · ")}
function choose(i){const e=getEvent(),c=e.choices[i],ch=c[2];for(const k of ["talent","mental","form","rep","money"])if(ch[k])game[k]=Math.max(0,game[k]+ch[k]);game.history.push({age:game.age,title:e.title,choice:c[0]});game.event++;let outcome=outcomeText(c[0],ch);game.age++;game.year++;game.form=Math.min(100,game.form+4);if(game.age>=41){save();retire();return}save();document.getElementById("feedback").textContent=outcome;document.getElementById("feedback").style.display="block";setTimeout(renderCareer,700)}
function outcomeText(choice,ch){if(ch.rep>=8)return`Ton choix « ${choice} » fait parler de toi. Les conséquences dépassent ce que tu imaginais.`;if(ch.form<=-10)return`Ton corps te rappelle que chaque décision a un prix. Tu vas devoir gérer les conséquences.`;if(ch.mental>=8)return`Tu sors de cette décision plus solide. Quelque chose change dans ta manière de voir le football.`;return`Tu avances. Rien n'est écrit, mais ton choix laisse une trace.`}
function save(){localStorage.setItem(KEY,JSON.stringify(game));document.getElementById("saveState").textContent="Une carrière est sauvegardée sur cet appareil."}
function continueCareer(){show("career");renderCareer()}
function newCareer(){localStorage.removeItem(KEY);game=null;startCreate()}
function retire(){show("retired");document.getElementById("retireTitle").textContent=`${game.name}. ${game.age} ans.`;document.getElementById("retireCard").innerHTML=`<div class="profile"><div class="avatar">${game.name.charAt(0).toUpperCase()}</div><div><div class="name">Fin de carrière</div><div class="sub">${game.nationality} · ${game.position}</div></div><div>🏁</div></div><div class="statrow"><div class="stat"><small>Talent</small><strong>${game.talent}</strong></div><div class="stat"><small>Mental</small><strong>${game.mental}</strong></div><div class="stat"><small>Réputation</small><strong>${game.rep}</strong></div><div class="stat"><small>Choix</small><strong>${game.history.length}</strong></div></div><p class="lead" style="margin-top:20px">Tu n'as pas suivi une carrière prédéfinie. Tu as construit celle-ci, décision après décision.</p>`}
if(game){document.getElementById("continueBtn").style.display="block";document.getElementById("saveState").textContent=`Carrière de ${game.name} · ${game.age} ans`}
document.getElementById("topYear").textContent=new Date().getFullYear();
</script>
</body>
</html>
